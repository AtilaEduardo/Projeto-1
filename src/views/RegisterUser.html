<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Usuário</title>
    <link rel="stylesheet" href="../public/css/RegisterUserStyle.css">
</head>

<body>
    <div class="container">
        <h1>Criar Conta</h1>
        <form id="registerForm" onsubmit="return validarIdade()">
            <label for="nameUser">Nome de Usuário:</label>
            <input type="text" id="nameUser" name="nameUser" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>

            <label for="passwordSecurity">Senha de Segurança:</label>
            <input type="password" id="passwordSecurity" name="passwordSecurity" required>

            <label for="fullName">Nome Completo:</label>
            <input type="text" id="fullName" name="fullName" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" onblur="validarEmail(this)" required>

            <label for="telephone">Telefone:</label>
            <input type="text" id="telephone" name="telephone" maxlength="16" placeholder="(00)00000-0000" required
                oninput="mascaraTelefone(this)">

            <label for="datebirth">Data de Nascimento:</label>
            <input type="date" id="datebirth" name="datebirth" required />

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" oninput="mascaraCPF(this)" required />

            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000" required
                oninput="mascaraCEP(this)">

            <label for="address">Endereço:</label>
            <input type="text" id="address" name="address" required>

            <label for="neighborhood">Bairro:</label>
            <input type="text" id="neighborhood" name="neighborhood" required>

            <label for="city">Cidade:</label>
            <input type="text" id="city" name="city" required>

            <label for="uf">UF:</label>
            <input type="text" id="uf" name="uf" required>

            <label for="isAdm">Administrador:</label>
            <input type="checkbox" id="isAdm" name="isAdm" onclick="toggleAdminPassword()">

            <div id="adminPasswordSection" style="display:none;">
                <label for="adminPassword">Chave de Confirmação:</label>
                <input type="password" id="adminPassword" name="adminPassword">
            </div>

            <input type="submit" value="Registrar">
        </form>
    </div>

    <!-- Link para o arquivo de máscaras JS -->
    <script src="../public/js/RegisterUserMaks.js"></script>
    <script src="../public/js/RegisterUserScript.js"></script>
</body>

</html>
